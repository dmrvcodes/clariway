name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev

      - name: Reject local configuration and secret patterns
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)\.env(\.local|\.development|\.production|\.test)?$'
          ! git grep -nE 'VITE_APP_CHECK_DEBUG_TOKEN[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{20,}|FIREBASE_APPCHECK_DEBUG_TOKEN[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{20,}'

      - name: Package unpacked extension
        run: zip -rq clariway-extension.zip dist

      - uses: actions/upload-artifact@v4
        with:
          name: clariway-extension-${{ github.sha }}
          path: clariway-extension.zip
          if-no-files-found: error
          retention-days: 14
