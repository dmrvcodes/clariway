name: Release Chrome extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - run: npm ci
      - run: npm run verify
      - run: zip -rq clariway-chrome-extension.zip dist
      - run: sha256sum clariway-chrome-extension.zip > clariway-chrome-extension.sha256

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          clariway-chrome-extension.zip
          clariway-chrome-extension.sha256
          --repo "$GITHUB_REPOSITORY"
          --title "Clariway $RELEASE_TAG"
          --generate-notes
