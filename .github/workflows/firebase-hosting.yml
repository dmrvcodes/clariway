name: Deploy judge site

on:
  pull_request:
    branches: [main]
    paths:
      - site/**
      - firebase.json
      - .firebaserc
      - .github/workflows/firebase-hosting.yml
  push:
    branches: [main]
    paths:
      - site/**
      - firebase.json
      - .firebaserc
      - .github/workflows/firebase-hosting.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: firebase-hosting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.FIREBASE_HOSTING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: firebase-hosting
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLARIWAY_1262E }}
          projectId: clariway-1262e

  live:
    if: >-
      github.event_name != 'pull_request' &&
      vars.FIREBASE_HOSTING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: firebase-hosting
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLARIWAY_1262E }}
          channelId: live
          projectId: clariway-1262e
